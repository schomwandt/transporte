# .github/workflows/poller_colectivos.yml
# Poller de posiciones de colectivos (API Transporte -> Supabase). Corre en la nube.
name: Poller colectivos AMBA
on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos (UTC, no aplica huso horario)
  workflow_dispatch:         # permite correrlo a mano desde Actions
jobs:
  poller:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Instalar paquetes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RPostgres
            any::httr
            any::jsonlite
            any::dplyr
      - name: Correr poller
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          API_TRANSPORTE_CLIENT_ID: ${{ secrets.API_TRANSPORTE_CLIENT_ID }}
          API_TRANSPORTE_CLIENT_SECRET: ${{ secrets.API_TRANSPORTE_CLIENT_SECRET }}
        run: Rscript R/etl/etl_gtfs_rt_poller.R